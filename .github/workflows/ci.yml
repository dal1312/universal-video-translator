name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements/windows-py310-x64.constraints.txt -e ".[all,dev]"

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q src universal_video_translator.py tests

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run static checks
        run: python -m ruff check src tests scripts

      - name: Validate browser extension syntax
        run: |
          node --check browser_extension/service-worker.js
          node --check browser_extension/popup.js
