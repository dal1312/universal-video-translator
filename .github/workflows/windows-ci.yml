name: Test and build Windows

on:
  # Nessun test/build automatico su push o pull request: sviluppo locale.
  # Il workflow resta disponibile solo per una verifica manuale pre-release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements/windows-py310-x64.constraints.txt -e ".[all,dev]"

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run tests
        run: python -m pytest -q --cov=uvt --cov-branch --cov-report=term

      - name: Compile Python sources
        run: python -m compileall -q src universal_video_translator.py tests

      - name: Run static checks
        run: python -m ruff check src tests scripts

      - name: Validate browser extension syntax
        run: |
          node --check browser_extension/service-worker.js
          node --check browser_extension/popup.js

      - name: Test browser extension UI logic
        run: node --test tests/browser/*.test.mjs

  build-windows:
    name: Build Windows application
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install application and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements/windows-py310-x64.constraints.txt ".[all]" pyinstaller==6.21.0

      - name: Install FFmpeg
        run: choco install ffmpeg --yes --no-progress

      - name: Build application
        run: pyinstaller --noconfirm --clean UniversalVideoTranslator.spec

      - name: Add runtime resources
        shell: pwsh
        run: |
          $sitePackages = python -c "import site; print(site.getsitepackages()[0])"
          Remove-Item "dist\UniversalVideoTranslator\_internal\language_tags\data" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "dist\UniversalVideoTranslator\_internal\espeakng_loader\espeak-ng-data" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item "$sitePackages\language_tags\data" "dist\UniversalVideoTranslator\_internal\language_tags\data" -Recurse -Force
          Copy-Item "$sitePackages\espeakng_loader\espeak-ng-data" "dist\UniversalVideoTranslator\_internal\espeakng_loader\espeak-ng-data" -Recurse -Force
          Copy-Item (Get-Command ffmpeg.exe).Source "dist\UniversalVideoTranslator\ffmpeg.exe" -Force
          Copy-Item (Get-Command ffprobe.exe).Source "dist\UniversalVideoTranslator\ffprobe.exe" -Force
          if (Get-Command ffplay.exe -ErrorAction SilentlyContinue) {
            Copy-Item (Get-Command ffplay.exe).Source "dist\UniversalVideoTranslator\ffplay.exe" -Force
          }

      - name: Verify and package application
        shell: pwsh
        run: |
          $app = "dist\UniversalVideoTranslator"
          $required = @(
            "$app\UniversalVideoTranslator.exe",
            "$app\ffmpeg.exe",
            "$app\_internal\language_tags\data\json\index.json",
            "$app\_internal\espeakng_loader\espeak-ng-data"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Required build resource is missing: $path"
            }
          }
          Compress-Archive -Path "$app\*" -DestinationPath "UniversalVideoTranslator-Windows-x64.zip" -CompressionLevel Optimal

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalVideoTranslator-Windows-x64
          path: UniversalVideoTranslator-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0

      - name: Attach package to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view "$env:GITHUB_REF_NAME" 2>$null) {
            gh release upload "$env:GITHUB_REF_NAME" "UniversalVideoTranslator-Windows-x64.zip" --clobber
          } else {
            gh release create "$env:GITHUB_REF_NAME" "UniversalVideoTranslator-Windows-x64.zip" --generate-notes --title "$env:GITHUB_REF_NAME"
          }
