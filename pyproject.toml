[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-video-translator"
version = "0.2.1"
description = "Local video translator with browser and real-time audio integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langdetect>=1.0.9,<2",
  "requests>=2.31,<3",
  "pyttsx3>=2.90,<3",
]

[project.optional-dependencies]
dev = [
  "numpy>=1.26,<3",
  "pytest>=8,<9",
  "ruff>=0.12,<0.13",
]
audio = ["faster-whisper>=1.1,<2"]
youtube = ["yt-dlp"]
live = ["faster-whisper>=1.1,<2", "numpy>=1.26,<3", "soundcard>=0.4,<1"]
kokoro = [
  "kokoro>=0.9.4,<1",
  "soundfile>=0.12,<1",
  "numpy>=1.26,<3",
  "soundcard>=0.4,<1",
]
all = [
  "faster-whisper>=1.1,<2",
  "kokoro>=0.9.4,<1",
  "numpy>=1.26,<3",
  "soundcard>=0.4,<1",
  "soundfile>=0.12,<1",
  "yt-dlp",
]

[project.gui-scripts]
universal-video-translator = "uvt.bootstrap:main"

[project.scripts]
uvt-cli = "uvt.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
