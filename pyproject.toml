[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-video-translator"
version = "0.3.0"
description = "Local AI video translator, live subtitles and screen assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31,<3",
  "pyttsx3>=2.90,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
audio = ["faster-whisper>=1.1,<2"]
youtube = ["yt-dlp"]
live = ["faster-whisper>=1.1,<2", "numpy>=1.26,<3", "soundcard>=0.4,<1"]
kokoro = [
  "kokoro>=0.9.4,<1",
  "soundfile>=0.12,<1",
  "numpy>=1.26,<3",
  "soundcard>=0.4,<1",
]
all = [
  "faster-whisper>=1.1,<2",
  "kokoro>=0.9.4,<1",
  "numpy>=1.26,<3",
  "soundcard>=0.4,<1",
  "soundfile>=0.12,<1",
  "yt-dlp",
  "Pillow>=10,<13",
  "pyautogui>=0.9.54,<1",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "PyMuPDF>=1.24,<2",
  "pystray>=0.19.5,<1",
]

assistant = ["Pillow>=10,<13"]
automation = ["pyautogui>=0.9.54,<1"]
windows = ["Pillow>=10,<13", "pystray>=0.19.5,<1"]
documents = [
  "Pillow>=10,<13",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "PyMuPDF>=1.24,<2",
]

[project.scripts]
universal-video-translator = "uvt.gui:main"
uvt-cli = "uvt.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
