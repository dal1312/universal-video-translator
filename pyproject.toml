[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-video-translator"
version = "0.1.0"
description = "Local subtitle translator and Italian text-to-speech player"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31,<3",
  "pyttsx3>=2.90,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
universal-video-translator = "uvt.gui:main"
uvt-cli = "uvt.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
